# --- Server (reads PORT env var if the hosting platform sets one, e.g. Railway/Render) ---
server.port=${PORT:8080}

# --- MySQL connection: local defaults below. On a hosting platform, override these with
#     environment variables SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME /
#     SPRING_DATASOURCE_PASSWORD - Spring Boot maps them automatically, no code change needed. ---
spring.datasource.url=jdbc:mysql://localhost:3306/fitspheredb
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Auto-run schema.sql against MySQL on every startup (tables use CREATE TABLE IF NOT EXISTS,
#     so this is safe to leave on - it will not wipe existing data) ---
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# --- Session cookie (used for simple login state) ---
server.servlet.session.timeout=2h
