<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FitSphere - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">

  <!-- ===================== LOGIN CARD ===================== -->
  <div class="auth-card" id="loginCard">
    <div class="auth-logo">FitSphere</div>
    <div class="auth-tagline">Personalized fitness, powered by your data</div>
    <div class="error-msg hidden" id="loginError"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword">
    </div>
    <button class="btn" id="loginBtn">Log In</button>
    <div class="auth-switch">New here? <a id="showRegister">Create an account</a></div>
  </div>

  <!-- ===================== REGISTER CARD ===================== -->
  <div class="auth-card wide hidden" id="registerCard">
    <div class="auth-logo" style="font-size:22px;">Create your FitSphere profile</div>
    <div class="error-msg hidden" id="registerError"></div>

    <div class="field"><label>Full Name</label><input type="text" id="regName"></div>
    <div class="field"><label>Email</label><input type="email" id="regEmail"></div>
    <div class="field"><label>Password</label><input type="password" id="regPassword"></div>
    <div class="field"><label>Age</label><input type="number" id="regAge" min="10" max="100"></div>
    <div class="field">
      <label>Gender</label>
      <select id="regGender"><option>Male</option><option>Female</option><option>Other</option></select>
    </div>
    <div class="field"><label>Height (cm)</label><input type="number" id="regHeight" step="0.1"></div>
    <div class="field"><label>Weight (kg)</label><input type="number" id="regWeight" step="0.1"></div>
    <div class="field">
      <label>Fitness Goal</label>
      <select id="regGoal">
        <option value="WEIGHT_LOSS">Weight Loss</option>
        <option value="MUSCLE_GAIN">Muscle Gain</option>
        <option value="MAINTENANCE">Maintenance</option>
        <option value="ENDURANCE">Endurance</option>
      </select>
    </div>
    <div class="field">
      <label>Current Activity Level</label>
      <select id="regActivity">
        <option value="SEDENTARY">Sedentary</option>
        <option value="LIGHT">Light</option>
        <option value="MODERATE">Moderate</option>
        <option value="ACTIVE">Active</option>
        <option value="VERY_ACTIVE">Very Active</option>
      </select>
    </div>
    <button class="btn" id="registerBtn">Create Account</button>
    <div class="auth-switch">Already have an account? <a id="showLogin">Log in</a></div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
